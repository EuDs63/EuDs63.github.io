{{- define "main" -}}
<div class="page-shell error-page">
  <p class="error-code" aria-hidden="true">404</p>
  {{ partial "v3/page-heading.html" (dict "eyebrow" "NOT FOUND" "title" "这一页，暂未找到" "description" "链接可能已经改变，也可能还没有这篇文字。" "meta" "") }}
  <nav class="error-actions" aria-label="继续浏览">
    <a class="text-link" href="{{ "" | relURL }}">回到首页 <span aria-hidden="true">↗</span></a>
    <a class="text-link" href="{{ "posts/" | relURL }}">翻阅文章 <span aria-hidden="true">→</span></a>
  </nav>
</div>
{{- end -}}
