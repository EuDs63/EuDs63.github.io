<header class="site-header">
<div class="header-inner">
<a class="brand" href="{{ "" | relURL }}" aria-label="EuDs 首页"><span class="brand-name">EuDs<span>.</span></span></a>
<nav class="main-nav" id="main-nav" aria-label="主导航">
<a href="{{ "posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>目录</a>
<a href="{{ "records/" | relURL }}" {{ if eq .Layout "records" }}aria-current="page"{{ end }}>书架</a>
<a href="{{ "discover/" | relURL }}" {{ if eq .Layout "search" }}aria-current="page"{{ end }}>搜索</a>
<a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink ("about/" | relURL) }}aria-current="page"{{ end }}>关于</a>
</nav>
<div class="header-tools">
<a class="search-trigger" href="{{ "discover/" | relURL }}" data-open-search aria-label="搜索文章">{{ partial "v3/icon.html" "search" }}<kbd>⌘ K</kbd></a>
<button class="icon-button theme-toggle" type="button" aria-label="切换到深色模式" title="切换明暗" data-theme-toggle><span class="theme-moon">{{ partial "v3/icon.html" "moon" }}</span><span class="theme-sun">{{ partial "v3/icon.html" "sun" }}</span></button>
<button class="icon-button mobile-menu" type="button" data-menu-toggle aria-controls="main-nav" aria-expanded="false" aria-label="展开导航">{{ partial "v3/icon.html" "menu" }}</button>
</div></div></header>
